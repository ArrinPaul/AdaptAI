<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AdaptAI Diagnostic</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #000000;
      --surface: #0a0a0a;
      --border: #222222;
      --text: #ffffff;
      --text-muted: #888888;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Plus Jakarta Sans', system-ui, sans-serif; }
    body { background-color: var(--bg); color: var(--text); -webkit-font-smoothing: antialiased; display: flex; flex-direction: column; min-height: 100vh; }
    
    header { max-width: 1200px; margin: 0 auto; padding: 2rem 1.5rem; width: 100%; display: flex; justify-content: space-between; align-items: center; }
    .brand { font-weight: 600; display: flex; align-items: center; gap: 0.5rem; }
    .brand svg { width: 24px; height: 24px; }
    .nav-links { display: flex; gap: 2rem; }
    .nav-links a { color: var(--text-muted); text-decoration: none; font-size: 0.875rem; transition: color 0.3s ease; }
    .nav-links a:hover { color: var(--text); }
    
    main { flex-grow: 1; display: flex; align-items: center; justify-content: center; padding: 4rem 1.5rem; }
    .card { background: var(--surface); border: 1px solid var(--border); border-radius: 24px; padding: 4rem; max-width: 600px; width: 100%; }
    
    h1 { font-size: 2rem; font-weight: 600; margin-bottom: 3rem; text-align: center; letter-spacing: -0.02em; }
    
    .step-bar { display: flex; justify-content: space-between; margin-bottom: 3rem; border-bottom: 1px solid var(--border); padding-bottom: 1.5rem; }
    .step { font-size: 0.75rem; text-transform: uppercase; letter-spacing: 0.05em; color: var(--text-muted); font-weight: 500; }
    .step.active { color: var(--text); }
    
    .test-step { display: none; }
    .test-step.active { display: block; animation: fadeIn 0.4s ease; }
    @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
    
    .group-title { font-size: 1.25rem; font-weight: 500; margin-bottom: 2rem; display: flex; align-items: center; gap: 0.5rem; }
    
    .option { display: block; margin-bottom: 1rem; cursor: pointer; }
    .option input { display: none; }
    .option-box { border: 1px solid var(--border); padding: 1.5rem; border-radius: 16px; transition: all 0.3s ease; }
    .option input:checked + .option-box { border-color: var(--text); background: #111; }
    
    .btn-row { display: flex; gap: 1rem; margin-top: 3rem; }
    .btn { flex: 1; padding: 1rem; border-radius: 9999px; border: none; font-size: 0.875rem; font-weight: 500; cursor: pointer; transition: all 0.3s ease; text-align: center; text-decoration: none; }
    .btn-primary { background: var(--text); color: var(--bg); }
    .btn-primary:hover { transform: scale(1.02); opacity: 0.9; }
    .btn-secondary { background: transparent; border: 1px solid var(--border); color: var(--text); }
    .btn-secondary:hover { background: var(--bg); border-color: #444; }
    
    .target-btn { padding: 1rem 3rem; background: var(--border); color: var(--text); border: none; border-radius: 9999px; cursor: pointer; margin-bottom: 2rem; transition: background 0.3s ease; }
    .target-btn:active { background: #444; }
    
    .score-grid { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 1rem; margin: 2rem 0; }
    .score-item { border: 1px solid var(--border); padding: 1.5rem; border-radius: 16px; text-align: center; }
    .score-label { font-size: 0.75rem; color: var(--text-muted); text-transform: uppercase; letter-spacing: 0.05em; margin-bottom: 0.5rem; display: block; }
    .score-val { font-size: 1.5rem; font-weight: 500; }
    
    svg { fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
  </style>
</head>
<body>
  <header>
    <div class="brand">
      <svg viewBox="0 0 24 24"><path d="M12 2L2 7l10 5 10-5-10-5zM2 17l10 5 10-5M2 12l10 5 10-5"/></svg>
      AdaptAI
    </div>
    <div class="nav-links">
      <a href="../../index.html">Home</a>
      <a href="../profile/profile.html">Profile</a>
      <a href="../../demo/index.html">Demo</a>
    </div>
  </header>

  <main>
    <div class="card">
      <h1>Accessibility Assessment</h1>
      
      <div class="step-bar">
        <div class="step active" id="step-dot-1">1. Visual</div>
        <div class="step" id="step-dot-2">2. Cognitive</div>
        <div class="step" id="step-dot-3">3. Motor</div>
        <div class="step" id="step-dot-4">4. Result</div>
      </div>

      <form id="profile-form">
        <div class="test-step active" id="step-1">
          <div class="group-title">
            <svg width="20" height="20" viewBox="0 0 24 24"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>
            Visual Legibility Test
          </div>
          
          <label class="option">
            <input type="radio" name="visual_test" value="standard">
            <div class="option-box" style="color: #666; font-size: 12px;">Sample A: Standard small text with low contrast grey font.</div>
          </label>
          <label class="option">
            <input type="radio" name="visual_test" value="high_contrast">
            <div class="option-box" style="background: #000; color: #fff;">Sample B: High Contrast (White text on deep black background).</div>
          </label>
          <label class="option">
            <input type="radio" name="visual_test" value="scaled_text">
            <div class="option-box" style="font-size: 1.5rem;">Sample C: Scaled Typography (1.5x larger font size).</div>
          </label>

          <div class="btn-row">
            <button type="button" class="btn btn-primary" id="btn-next-2">Continue</button>
          </div>
        </div>

        <div class="test-step" id="step-2">
          <div class="group-title">
            <svg width="20" height="20" viewBox="0 0 24 24"><path d="M12 2a10 10 0 1 0 10 10A10 10 0 0 0 12 2zm0 18a8 8 0 1 1 8-8 8 8 0 0 1-8 8z"/><path d="M12 6v6l4 2"/></svg>
            Cognitive Readability Test
          </div>
          
          <label class="option">
            <input type="radio" name="cognitive_test" value="dense">
            <div class="option-box">Hyper-scaled cloud architecture deployments recorded exponential productivity metrics.</div>
          </label>
          <label class="option">
            <input type="radio" name="cognitive_test" value="simplified">
            <div class="option-box">Cloud systems boosted performance by 14% this quarter.</div>
          </label>

          <div class="btn-row">
            <button type="button" class="btn btn-secondary" id="btn-back-1">Back</button>
            <button type="button" class="btn btn-primary" id="btn-next-3">Continue</button>
          </div>
        </div>

        <div class="test-step" id="step-3">
          <div class="group-title">
            <svg width="20" height="20" viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"/><circle cx="12" cy="12" r="6"/><circle cx="12" cy="12" r="2"/></svg>
            Motor Click Precision Test
          </div>
          
          <div style="text-align: center; padding: 2rem 0;">
            <button type="button" class="target-btn">Click Target</button>
          </div>

          <div class="btn-row">
            <button type="button" class="btn btn-secondary" id="btn-back-2">Back</button>
            <button type="button" class="btn btn-primary" id="btn-calc-persona">Generate Persona</button>
          </div>
        </div>

        <div class="test-step" id="step-4">
          <div style="text-align: center; margin-bottom: 2rem;">
            <h2 style="font-size: 1.5rem; font-weight: 500;">Custom Persona Created</h2>
          </div>
          
          <div class="score-grid">
            <div class="score-item">
              <span class="score-label">Visual</span>
              <span class="score-val">85</span>
            </div>
            <div class="score-item">
              <span class="score-label">Cognitive</span>
              <span class="score-val">90</span>
            </div>
            <div class="score-item">
              <span class="score-label">Motor</span>
              <span class="score-val">95</span>
            </div>
          </div>

          <div class="btn-row">
            <a href="../profile/profile.html" class="btn btn-secondary">View Profile</a>
            <a href="../../demo/index.html" class="btn btn-primary">Launch Demo</a>
          </div>
        </div>
      </form>
    </div>
  </main>

  <script src="onboarding.js"></script>
</body>
</html>
