<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AdaptAI Profile</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #000000;
      --surface: #0a0a0a;
      --border: #222222;
      --text: #ffffff;
      --text-muted: #888888;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Plus Jakarta Sans', system-ui, sans-serif; }
    body { background-color: var(--bg); color: var(--text); -webkit-font-smoothing: antialiased; display: flex; flex-direction: column; min-height: 100vh; }
    
    header { max-width: 1200px; margin: 0 auto; padding: 2rem 1.5rem; width: 100%; display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid var(--border); }
    .brand { font-weight: 600; display: flex; align-items: center; gap: 0.5rem; }
    .brand svg { width: 24px; height: 24px; }
    .nav-links { display: flex; gap: 2rem; align-items: center; }
    .nav-links a { color: var(--text-muted); text-decoration: none; font-size: 0.875rem; transition: color 0.3s ease; }
    .nav-links a:hover { color: var(--text); }
    
    main { flex-grow: 1; padding: 6rem 1.5rem; max-width: 1000px; margin: 0 auto; width: 100%; display: grid; grid-template-columns: 1fr 2fr; gap: 4rem; }
    
    @media (max-width: 768px) { main { grid-template-columns: 1fr; } }
    
    .card { background: var(--surface); border: 1px solid var(--border); border-radius: 24px; padding: 2.5rem; margin-bottom: 2rem; }
    h2 { font-size: 1.5rem; font-weight: 600; margin-bottom: 2rem; letter-spacing: -0.02em; }
    h3 { font-size: 1.25rem; font-weight: 500; margin-bottom: 2rem; }
    
    .persona-name { font-size: 2rem; font-weight: 600; margin-bottom: 1rem; }
    
    .score-row { display: flex; justify-content: space-between; align-items: center; padding: 1rem 0; border-bottom: 1px solid var(--border); font-size: 0.875rem; }
    .score-row:last-child { border-bottom: none; }
    
    .control-row { display: flex; justify-content: space-between; align-items: center; padding: 1.5rem 0; border-bottom: 1px solid var(--border); }
    .control-row:last-child { border-bottom: none; }
    .control-label { display: flex; flex-direction: column; gap: 0.25rem; }
    .control-label strong { font-weight: 500; font-size: 1rem; }
    
    .switch { position: relative; width: 44px; height: 24px; }
    .switch input { opacity: 0; width: 0; height: 0; }
    .slider { position: absolute; cursor: pointer; top: 0; left: 0; right: 0; bottom: 0; background-color: #222; transition: .3s; border-radius: 24px; border: 1px solid var(--border); }
    .slider:before { position: absolute; content: ""; height: 16px; width: 16px; left: 3px; bottom: 3px; background-color: var(--text-muted); transition: .3s; border-radius: 50%; }
    input:checked + .slider { background-color: var(--text); border-color: var(--text); }
    input:checked + .slider:before { transform: translateX(20px); background-color: var(--bg); }
    
    .btn { padding: 1rem 2rem; border-radius: 9999px; border: none; font-size: 0.875rem; font-weight: 500; cursor: pointer; transition: all 0.3s ease; text-align: center; text-decoration: none; display: inline-block; }
    .btn-primary { background: var(--text); color: var(--bg); }
    .btn-primary:hover { transform: scale(1.02); opacity: 0.9; }
    .btn-secondary { background: transparent; border: 1px solid var(--border); color: var(--text); width: 100%; }
    .btn-secondary:hover { background: #111; border-color: #444; }
    
    .actions-bar { display: flex; gap: 1rem; margin-top: 2rem; }
    
    svg { fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
  </style>
</head>
<body>
  <header>
    <div class="brand">
      <svg viewBox="0 0 24 24"><path d="M12 2L2 7l10 5 10-5-10-5zM2 17l10 5 10-5M2 12l10 5 10-5"/></svg>
      AdaptAI
    </div>
    <div class="nav-links">
      <a href="../../index.html">Home</a>
      <a href="../onboarding/onboarding.html">Diagnostic</a>
      <a href="../../demo/index.html" class="btn btn-primary" style="padding: 0.75rem 1.5rem;">Demo</a>
    </div>
  </header>

  <main>
    <aside>
      <div class="card">
        <h2 class="persona-name">Custom Assist</h2>
        <div style="margin-bottom: 2rem;">
          <div class="score-row">
            <span>Visual Contrast</span>
            <span>85/100</span>
          </div>
          <div class="score-row">
            <span>Cognitive</span>
            <span>90/100</span>
          </div>
          <div class="score-row">
            <span>Motor Precision</span>
            <span>95/100</span>
          </div>
        </div>
        <a href="../onboarding/onboarding.html" class="btn btn-secondary">Retake Assessment</a>
      </div>
    </aside>

    <section>
      <form id="settings-form">
        <div class="card">
          <h3>Visual Setup</h3>
          <div class="control-row">
            <div class="control-label">
              <strong>High Contrast Mode</strong>
            </div>
            <label class="switch"><input type="checkbox"><span class="slider"></span></label>
          </div>
          <div class="control-row">
            <div class="control-label">
              <strong>Font Scale (1.5x)</strong>
            </div>
            <input type="range" min="1.0" max="2.0" step="0.1" value="1.5" style="width: 150px;">
          </div>
        </div>

        <div class="card">
          <h3>Cognitive & Reading</h3>
          <div class="control-row">
            <div class="control-label">
              <strong>OpenDyslexic Font</strong>
            </div>
            <label class="switch"><input type="checkbox"><span class="slider"></span></label>
          </div>
          <div class="control-row">
            <div class="control-label">
              <strong>AI Text Simplification</strong>
            </div>
            <label class="switch"><input type="checkbox"><span class="slider"></span></label>
          </div>
        </div>

        <div class="card">
          <h3>Motor Precision</h3>
          <div class="control-row">
            <div class="control-label">
              <strong>Motor Target Expansion</strong>
            </div>
            <label class="switch"><input type="checkbox"><span class="slider"></span></label>
          </div>
        </div>

        <div class="actions-bar">
          <button type="button" class="btn btn-primary" style="flex: 1;">Save Profile</button>
          <a href="../../demo/index.html" class="btn btn-secondary" style="flex: 1; width: auto;">Open Demo</a>
        </div>
      </form>
    </section>
  </main>

  <script src="profile.js"></script>
</body>
</html>
