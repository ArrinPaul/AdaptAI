<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AdaptAI Extension Control Center</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #000000;
      --card-bg: #0a0a0a;
      --card-border: #1a1a1a;
      --text-bright: #ffffff;
      --text-muted: #888888;
      --text-dim: #555555;
      --accent-white: #ffffff;
      --status-active: #ffffff;
      --status-disabled: #555555;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    }

    body {
      width: 320px;
      background-color: var(--bg);
      color: var(--text-bright);
      padding: 24px;
      user-select: none;
    }

    .header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding-bottom: 24px;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 10px;
      font-weight: 700;
      font-size: 14px;
      letter-spacing: -0.2px;
      color: var(--text-bright);
    }

    .brand-mark {
      width: 6px;
      height: 6px;
      background: var(--text-bright);
      border-radius: 1px;
    }

    .status-badge {
      display: flex;
      align-items: center;
      gap: 6px;
      font-size: 10px;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      color: var(--text-bright);
    }

    .status-badge.disabled {
      color: var(--text-dim);
    }

    .status-dot {
      width: 4px;
      height: 4px;
      background: var(--status-active);
      border-radius: 50%;
    }

    .status-badge.disabled .status-dot {
      background: var(--status-disabled);
    }

    .master-toggle-box {
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      padding: 16px;
      border-radius: 8px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 16px;
    }

    .toggle-info h4 {
      font-size: 12px;
      font-weight: 500;
      color: var(--text-bright);
    }

    .toggle-info p {
      font-size: 10px;
      color: var(--text-muted);
      margin-top: 2px;
    }

    .master-switch {
      position: relative;
      display: inline-block;
      width: 32px;
      height: 18px;
    }

    .master-switch input { opacity: 0; width: 0; height: 0; }

    .slider {
      position: absolute;
      cursor: pointer;
      top: 0; left: 0; right: 0; bottom: 0;
      background-color: var(--card-border);
      transition: .2s ease;
      border-radius: 9999px;
    }

    .slider:before {
      position: absolute;
      content: "";
      height: 12px;
      width: 12px;
      left: 3px;
      bottom: 3px;
      background-color: var(--text-bright);
      transition: .2s ease;
      border-radius: 50%;
    }

    input:checked + .slider { background-color: var(--text-bright); }
    input:checked + .slider:before { transform: translateX(14px); background-color: var(--bg); }

    .persona-banner {
      background: transparent;
      border: 1px solid var(--card-border);
      border-radius: 8px;
      padding: 12px 16px;
      margin-bottom: 16px;
    }

    .persona-title {
      font-size: 9px;
      font-weight: 600;
      color: var(--text-dim);
      text-transform: uppercase;
      letter-spacing: 0.6px;
    }

    .persona-name {
      font-size: 12px;
      font-weight: 500;
      color: var(--text-bright);
      margin-top: 4px;
    }

    .btn-adapt-now {
      background: var(--text-bright);
      color: var(--bg);
      border: none;
      width: 100%;
      padding: 12px;
      border-radius: 6px;
      font-weight: 600;
      font-size: 12px;
      cursor: pointer;
      transition: opacity 0.2s ease;
      margin-bottom: 24px;
    }

    .btn-adapt-now:hover {
      opacity: 0.9;
    }

    .menu-list {
      display: flex;
      flex-direction: column;
      gap: 4px;
    }

    .menu-item {
      display: flex;
      align-items: center;
      justify-content: space-between;
      color: var(--text-muted);
      text-decoration: none;
      font-size: 11px;
      padding: 8px 0;
      transition: color 0.2s ease;
    }

    .menu-item:hover {
      color: var(--text-bright);
    }

    .arrow-icon {
      font-size: 10px;
    }
  </style>
</head>
<body>
  <div class="header">
    <div class="brand">
      <span class="brand-mark"></span>
      <span>ADAPTAI</span>
    </div>
    <div id="status-badge" class="status-badge">
      <span class="status-dot"></span> <span id="status-text">ON</span>
    </div>
  </div>

  <div class="master-toggle-box">
    <div class="toggle-info">
      <h4>Extension</h4>
      <p id="toggle-desc">Global processing active</p>
    </div>
    <label class="master-switch">
      <input type="checkbox" id="master-toggle" checked>
      <span class="slider"></span>
    </label>
  </div>

  <div class="persona-banner" id="persona-banner">
    <div class="persona-title">Active Profile</div>
    <div class="persona-name" id="persona-name">High-Contrast Visual Assist</div>
  </div>

  <button class="btn-adapt-now" id="trigger-adapt">Run Adaptation</button>

  <div class="menu-list">
    <a href="http://localhost:8080/index.html" id="link-landing" target="_blank" class="menu-item">
      <span>Documentation</span>
      <span class="arrow-icon">/</span>
    </a>
    <a href="http://localhost:8080/extension/onboarding/onboarding.html" id="link-onboarding" target="_blank" class="menu-item">
      <span>Assessment</span>
      <span class="arrow-icon">/</span>
    </a>
    <a href="http://localhost:8080/extension/profile/profile.html" id="link-profile" target="_blank" class="menu-item">
      <span>Preferences</span>
      <span class="arrow-icon">/</span>
    </a>
    <a href="http://localhost:8080/demo/index.html" id="link-demo" target="_blank" class="menu-item">
      <span>Workbench</span>
      <span class="arrow-icon">/</span>
    </a>
  </div>

  <script src="popup.js"></script>
</body>
</html>
