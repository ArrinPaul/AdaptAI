<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AdaptAI Extension Controls</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #0d1117;
      --card-bg: #161b22;
      --text-bright: #f0f6fc;
      --text-subtle: #8b949e;
      --accent: #2f81f7;
      --border: rgba(240, 246, 252, 0.1);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Plus Jakarta Sans', system-ui, sans-serif;
    }

    body {
      width: 320px;
      background-color: var(--bg);
      color: var(--text-bright);
      padding: 16px;
    }

    .header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding-bottom: 12px;
      border-bottom: 1px solid var(--border);
      margin-bottom: 14px;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 8px;
      font-weight: 800;
      font-size: 16px;
    }

    .status-dot {
      width: 8px;
      height: 8px;
      background: #3fb950;
      border-radius: 50%;
      box-shadow: 0 0 8px #3fb950;
    }

    .btn-adapt-now {
      background: linear-gradient(135deg, #238636, #2ea043);
      color: white;
      border: none;
      width: 100%;
      padding: 12px;
      border-radius: 10px;
      font-weight: 700;
      font-size: 14px;
      cursor: pointer;
      box-shadow: 0 4px 14px rgba(46, 160, 67, 0.4);
      transition: all 0.2s;
      margin-bottom: 14px;
    }

    .btn-adapt-now:hover {
      transform: translateY(-1px);
      box-shadow: 0 6px 18px rgba(46, 160, 67, 0.6);
    }

    .quick-toggles {
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .toggle-row {
      background: var(--card-bg);
      border: 1px solid var(--border);
      padding: 10px 14px;
      border-radius: 8px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 13px;
      font-weight: 600;
    }

    .switch {
      position: relative;
      display: inline-block;
      width: 36px;
      height: 20px;
    }

    .switch input {
      opacity: 0;
      width: 0;
      height: 0;
    }

    .slider {
      position: absolute;
      cursor: pointer;
      top: 0; left: 0; right: 0; bottom: 0;
      background-color: #30363d;
      transition: .3s;
      border-radius: 20px;
    }

    .slider:before {
      position: absolute;
      content: "";
      height: 14px;
      width: 14px;
      left: 3px;
      bottom: 3px;
      background-color: white;
      transition: .3s;
      border-radius: 50%;
    }

    input:checked + .slider {
      background-color: var(--accent);
    }

    input:checked + .slider:before {
      transform: translateX(16px);
    }

    .footer-links {
      margin-top: 14px;
      padding-top: 10px;
      border-top: 1px solid var(--border);
      display: flex;
      justify-content: space-between;
      font-size: 11px;
    }

    .footer-links a {
      color: var(--text-subtle);
      text-decoration: none;
    }

    .footer-links a:hover {
      color: var(--accent);
    }
  </style>
</head>
<body>
  <div class="header">
    <div class="brand">⚡ AdaptAI</div>
    <div style="display:flex; align-items:center; gap:6px; font-size:11px; color:#8b949e;">
      <span class="status-dot"></span> Active
    </div>
  </div>

  <button class="btn-adapt-now" id="trigger-adapt">✨ Adapt Page Now (Ctrl+Shift+A)</button>

  <div class="quick-toggles">
    <div class="toggle-row">
      <span>👁️ High Contrast Theme</span>
      <label class="switch">
        <input type="checkbox" id="toggle-contrast" checked>
        <span class="slider"></span>
      </label>
    </div>

    <div class="toggle-row">
      <span>📖 OpenDyslexic Font</span>
      <label class="switch">
        <input type="checkbox" id="toggle-dyslexic" checked>
        <span class="slider"></span>
      </label>
    </div>

    <div class="toggle-row">
      <span>🧠 AI Text Simplification</span>
      <label class="switch">
        <input type="checkbox" id="toggle-simplify" checked>
        <span class="slider"></span>
      </label>
    </div>
  </div>

  <div class="footer-links">
    <a href="/extension/onboarding/onboarding.html" target="_blank">⚙️ Settings & Assessment</a>
    <a href="/demo/index.html" target="_blank">🧪 Launch Demo</a>
  </div>

  <script src="popup.js"></script>
</body>
</html>
