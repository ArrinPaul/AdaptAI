<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AdaptAI Extension</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #000000;
      --surface: #0a0a0a;
      --border: #222222;
      --text: #ffffff;
      --text-muted: #888888;
      --accent: #ffffff;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Plus Jakarta Sans', system-ui, sans-serif; }
    body { width: 320px; background-color: var(--bg); color: var(--text); padding: 1.5rem; user-select: none; -webkit-font-smoothing: antialiased; }
    
    header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 2rem; }
    .brand { font-weight: 600; font-size: 1rem; display: flex; align-items: center; gap: 0.5rem; }
    .brand svg { width: 18px; height: 18px; }
    
    .status { display: flex; align-items: center; gap: 0.5rem; font-size: 0.75rem; font-weight: 500; padding: 0.25rem 0.75rem; border-radius: 9999px; background: #111; border: 1px solid var(--border); }
    .status-dot { width: 6px; height: 6px; border-radius: 50%; background: #ffffff; }
    
    .toggle-group { background: var(--surface); border: 1px solid var(--border); border-radius: 16px; padding: 1.25rem; margin-bottom: 1rem; display: flex; justify-content: space-between; align-items: center; }
    .toggle-info h4 { font-size: 0.875rem; font-weight: 500; margin-bottom: 0.25rem; }
    .toggle-info p { font-size: 0.75rem; color: var(--text-muted); }
    
    .switch { position: relative; width: 40px; height: 24px; }
    .switch input { opacity: 0; width: 0; height: 0; }
    .slider { position: absolute; cursor: pointer; top: 0; left: 0; right: 0; bottom: 0; background-color: #222; transition: .3s; border-radius: 24px; border: 1px solid var(--border); }
    .slider:before { position: absolute; content: ""; height: 16px; width: 16px; left: 3px; bottom: 3px; background-color: var(--text-muted); transition: .3s; border-radius: 50%; }
    input:checked + .slider { background-color: var(--text); border-color: var(--text); }
    input:checked + .slider:before { transform: translateX(16px); background-color: var(--bg); }
    
    .persona { background: var(--bg); border: 1px solid var(--border); border-radius: 16px; padding: 1.25rem; margin-bottom: 1.5rem; text-align: center; }
    .persona-label { font-size: 0.75rem; text-transform: uppercase; letter-spacing: 0.05em; color: var(--text-muted); margin-bottom: 0.5rem; }
    .persona-name { font-size: 1rem; font-weight: 600; }
    
    .btn-adapt { background: var(--text); color: var(--bg); border: none; width: 100%; padding: 1rem; border-radius: 9999px; font-weight: 500; font-size: 0.875rem; cursor: pointer; transition: all 0.3s ease; margin-bottom: 2rem; }
    .btn-adapt:hover { transform: scale(1.02); }
    
    .menu { display: flex; flex-direction: column; gap: 0.5rem; }
    .menu-item { display: flex; justify-content: space-between; align-items: center; padding: 0.875rem 1rem; background: var(--surface); border: 1px solid var(--border); border-radius: 12px; color: var(--text); text-decoration: none; font-size: 0.875rem; transition: all 0.3s ease; }
    .menu-item:hover { border-color: #444; background: #111; }
    .menu-item svg { width: 16px; height: 16px; opacity: 0.5; }
    
    svg { fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
  </style>
</head>
<body>
  <header>
    <div class="brand">
      <svg viewBox="0 0 24 24"><path d="M12 2L2 7l10 5 10-5-10-5zM2 17l10 5 10-5M2 12l10 5 10-5"/></svg>
      AdaptAI
    </div>
    <div class="status">
      <span class="status-dot"></span> ON
    </div>
  </header>

  <div class="toggle-group">
    <div class="toggle-info">
      <h4>Extension</h4>
      <p>DOM active</p>
    </div>
    <label class="switch">
      <input type="checkbox" checked>
      <span class="slider"></span>
    </label>
  </div>

  <div class="persona">
    <div class="persona-label">Active Persona</div>
    <div class="persona-name">High-Contrast Assist</div>
  </div>

  <button class="btn-adapt">Adapt Page</button>

  <div class="menu">
    <a href="../../index.html" id="link-landing" class="menu-item">
      Landing Page <svg viewBox="0 0 24 24"><path d="M5 12h14M12 5l7 7-7 7"/></svg>
    </a>
    <a href="../onboarding/onboarding.html" id="link-onboarding" class="menu-item">
      Diagnostic Test <svg viewBox="0 0 24 24"><path d="M5 12h14M12 5l7 7-7 7"/></svg>
    </a>
    <a href="../profile/profile.html" id="link-profile" class="menu-item">
      Profile Settings <svg viewBox="0 0 24 24"><path d="M5 12h14M12 5l7 7-7 7"/></svg>
    </a>
    <a href="../../demo/index.html" id="link-demo" class="menu-item">
      Demo Workbench <svg viewBox="0 0 24 24"><path d="M5 12h14M12 5l7 7-7 7"/></svg>
    </a>
  </div>

  <script src="popup.js"></script>
</body>
</html>
