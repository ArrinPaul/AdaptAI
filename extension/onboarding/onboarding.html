<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AdaptAI — Onboarding Setup</title>
  <link rel="stylesheet" href="onboarding.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
</head>
<body>
  <div class="glow-bg"></div>

  <div class="onboarding-card">
    <div class="card-header">
      <div class="brand">⚡ AdaptAI</div>
      <h1>Tailor Your Web Experience</h1>
      <p>Select your preferences below. Our AI engine will transform websites automatically.</p>
    </div>

    <form id="profile-form">
      <div class="section-group">
        <div class="group-title">
          <span class="icon">👁️</span> Visual Accessibility
        </div>
        <label class="custom-toggle">
          <input type="checkbox" id="high-contrast">
          <div class="toggle-box">
            <span class="label-text">High Contrast Theme</span>
            <span class="sub-text">Dark background with vibrant high-contrast typography</span>
          </div>
        </label>
        <label class="custom-toggle">
          <input type="checkbox" id="large-text">
          <div class="toggle-box">
            <span class="label-text">Larger Typography Scale</span>
            <span class="sub-text">Increases font scaling by 1.5x across elements</span>
          </div>
        </label>
      </div>

      <div class="section-group">
        <div class="group-title">
          <span class="icon">🧠</span> Cognitive Accessibility
        </div>
        <label class="custom-toggle">
          <input type="checkbox" id="dyslexic-font">
          <div class="toggle-box">
            <span class="label-text">Dyslexia-Friendly Font</span>
            <span class="sub-text">Injects OpenDyslexic typeface for improved readability</span>
          </div>
        </label>
        <label class="custom-toggle">
          <input type="checkbox" id="simplify-text">
          <div class="toggle-box">
            <span class="label-text">AI Text Simplification</span>
            <span class="sub-text">Rewrites dense academic jargon into clear summaries</span>
          </div>
        </label>
      </div>

      <div class="section-group">
        <div class="group-title">
          <span class="icon">🔊</span> Audio & Motor Control
        </div>
        <label class="custom-toggle">
          <input type="checkbox" id="enable-audio">
          <div class="toggle-box">
            <span class="label-text">Read Aloud & Voice Commands</span>
            <span class="sub-text">Enables floating audio narration and speech navigation</span>
          </div>
        </label>
      </div>

      <button type="submit" class="submit-btn">
        Save Profile & Launch Demo Page 🚀
      </button>
    </form>

    <div id="success-message">
      ✨ Profile saved! Redirecting to demo page in 2 seconds...
    </div>
  </div>

  <script src="onboarding.js"></script>
</body>
</html>
